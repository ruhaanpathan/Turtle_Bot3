# ─────────────────────────────────────────────────────────────────────────────
# Frontier Exploration Parameters — Tuned for Custom Diff Drive Robot
#
# Hardware: YDLidar X2/X4 (8m range, 360° FOV), Pi 5, small differential drive
# Environment: Indoor rooms/hallways
# ─────────────────────────────────────────────────────────────────────────────

frontier_explorer:
  ros__parameters:

    # --------------- TOPICS --------------- #
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose
    global_frame: map
    robot_base_frame: base_link
    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map
    completion_event_topic: exploration_complete
    frontier_marker_scale: 0.10

    # --------------- QoS --------------- #
    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1
    map_qos_autodetect_on_startup: false
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1

    # --------------- GENERAL --------------- #
    # Lower rate for Pi 5 CPU conservation
    map_processing_rate_hz: 0.5

    # Start exploring immediately when launched
    autostart: true

    # Keep control service available for manual stop
    control_service_enabled: true

    # Publish completion event when no frontiers remain
    completion_event_enabled: true

    # Allow farther frontier fallback initially (useful for small LiDAR range)
    escape_enabled: true

    # Return to starting position when exploration is complete
    return_to_start_on_complete: true

    # Use greedy MRTSP (lower CPU than DP, fine for Pi 5)
    mrtsp_solver: greedy

    # Enable map preprocessing for cleaner frontier extraction
    frontier_map_optimization_enabled: true

    # Enable preemption if current goal has no more area to reveal
    goal_preemption_enabled: true
    goal_preemption_min_interval_s: 3.0

    # Skip goals that become blocked
    goal_skip_on_blocked_goal: true

    # Enable settle delay for slow SLAM on Pi 5
    post_goal_settle_enabled: true
    post_goal_min_settle: 2.0

    # Enable suppression for repeatedly failing frontiers
    frontier_suppression_enabled: true
    all_frontiers_suppressed_behavior: return_to_start

    # --------------- MRTSP Scoring --------------- #
    weight_distance_wd: 1.5        # Prefer closer frontiers (saves battery on small robot)
    weight_gain_ws: 1.0            # Standard information gain weight
    max_linear_speed_vmax: 0.20    # Match controller desired_linear_vel
    max_angular_speed_wmax: 0.4    # Match mapping-safe Nav2 angular limit
    sensor_effective_range_m: 3.0  # Conservative usable range with the 3.5m scan cap

    # --------------- Navigation Safety --------------- #
    # Min distance before frontier is a valid target (~2.5x robot radius of 0.15m)
    frontier_selection_min_distance: 0.40
    frontier_visit_tolerance: 0.30

    # --------------- Map Optimization --------------- #
    frontier_candidate_min_goal_distance_m: 0.40
    occ_threshold: 65
    min_frontier_size_cells: 3      # Smaller value to catch narrow doorways
    sigma_s: 2.0
    sigma_r: 30.0
    dilation_kernel_radius_cells: 1

    # --------------- Preemption --------------- #
    goal_preemption_complete_if_within_m: 0.35
    goal_preemption_lidar_range_m: 3.5       # Matches the active YDLidar range cap
    goal_preemption_lidar_fov_deg: 360.0     # Full 360° scan
    goal_preemption_lidar_ray_step_deg: 2.0  # Coarser for Pi 5 CPU
    goal_preemption_lidar_min_reveal_length_m: 0.3
    goal_preemption_lidar_yaw_offset_deg: 0.0

    # --------------- Suppression --------------- #
    frontier_suppression_attempt_threshold: 3
    frontier_suppression_base_size_m: 0.8
    frontier_suppression_expansion_size_m: 0.4
    frontier_suppression_timeout_s: 120.0
    frontier_suppression_no_progress_timeout_s: 25.0
    frontier_suppression_progress_epsilon_m: 0.15
    frontier_suppression_startup_grace_period_s: 20.0
    frontier_suppression_max_attempt_records: 128
    frontier_suppression_max_regions: 32
