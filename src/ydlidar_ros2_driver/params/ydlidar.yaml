ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    isSingleChannel: true
    intensity: false
    intensity_bit: 0
    auto_intensity: false
    sample_rate: 3
    abnormal_check_count: 4
    fixed_resolution: false
    reversion: false
    # X2 reports scan angles clockwise. Mirror them into ROS REP-103
    # counter-clockwise coordinates. The separate URDF yaw handles the
    # sensor's physical 180-degree mounting on this robot.
    inverted: true
    auto_reconnect: true
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    range_max: 8.0
    range_min: 0.12
    frequency: 7.0
    invalid_range_is_inf: false
    debug: false
